name: Publicar no Instagram

on:
  schedule:
    # Feed no ALMOÇO às 12h (Brasília) = 15h (UTC). Roda todos os dias.
    # Os posts saem seg/qua/sex (e datas especiais) no horário de pico de engajamento.
    - cron: "0 15 * * *"
    # Manhã: 10h (Brasília) = 13h (UTC), para posts especiais de manhã.
    - cron: "0 13 * * *"
    # Tarde: 18h (Brasília) = 21h (UTC), para posts marcados no fim da tarde.
    - cron: "0 21 * * *"
    # Stories: sábado às 14h (Brasília) = sábado 17h (UTC).
    - cron: "0 17 * * 6"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (não publica)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repositorio
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publicar posts do dia
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_URL: ${{ vars.IG_GRAPH_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python main.py publicar ${{ inputs.simular && '--simular' || '' }}

      - name: Registrar publicação no repositório
        run: |
          git config user.name "agente-marketing"
          git config user.email "agente-marketing@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet || (git commit -m "Post publicado no Instagram" && git pull --rebase && git push)
