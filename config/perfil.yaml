# Áreas de conteúdo. "peso" = proporção no calendário.
areas:
  - nome: "Direito Bancário e Consignados"
    peso: 10
    temas_exemplo: ["fraude do empréstimo consignado não contratado", "descontos indevidos de cartão RMC e RCC",
                    "juros abusivos em financiamentos", "ação de superendividamento (Lei 14.181/2021)",
                    "devolução em dobro do indébito (Tema 929 STF e EAREsp 676.608)", "golpe do falso intermediário bancário"]
  - nome: "Direito Previdenciário (INSS)"
    peso: 6
    temas_exemplo: ["regras de transição da EC 103/2019", "planejamento previdenciário e descarte de contribuições",
                    "BPC/LOAS para idosos e PCD", "pensão por morte e dependentes",
                    "tempo especial e conversão (Tema 1.090/STJ)", "revisão de benefícios e decadência"]
  - nome: "Regularização Imobiliária"
    peso: 4
    temas_exemplo: ["usucapião extrajudicial em cartório", "contrato de gaveta x escritura x registro",
                    "adjudicação compulsória extrajudicial", "imóvel de herança e inventário",
                    "regularização fundiária urbana (REURB)", "ITBI e transmissão imobiliária"]
  - nome: "Direito do Consumidor e Contratos"
    peso: 3
    temas_exemplo: ["negativação indevida e dano moral in re ipsa", "cobranças abusivas de tarifas bancárias",
                    "cláusulas contratuais leoninas", "cancelamento de serviços essenciais"]

